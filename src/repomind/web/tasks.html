<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="repomind-csrf" content="__CSRF__"><title>任务工作台 · RepoMind</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css"><script src="/static/tasks.js" defer></script></head>
<body><a class="skip" href="#task-form">跳到开发任务</a><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">R</span>RepoMind</div><nav aria-label="工作台页面"><a href="/tasks" aria-current="page">任务</a><a id="review-link" href="/review">待确认</a><a id="memories-link" href="/memories">项目记忆</a><a href="/comparisons">记忆对照</a></nav><span class="local-label">本地工作台</span></header>
<main><div class="page-heading"><div><h1>开发任务</h1><p>描述开发需求，完成后核对修改与证据，再决定要记住什么。</p></div></div>
<p id="task-notice" role="status" aria-live="polite" class="notice"></p>
<div class="task-layout"><section class="task-compose"><form id="task-form"><label>项目<select id="task-project" required></select></label><label>开发需求<textarea id="task-prompt" rows="7" maxlength="8000" required placeholder="例如：修复一个分页边界问题，并补充回归测试。"></textarea></label><p class="help">无需填写记忆字段或引用。助手会根据实际文件产出提出候选。</p><button class="primary" id="prepare-task" type="submit">检查环境与相关记忆</button></form><div id="preflight"></div><button id="start-task" class="primary" type="button" disabled>启动开发任务</button><p class="help">启动后使用当前 Codex 登录与额度，在所选项目中执行 workspace-write 会话。</p><section class="task-history"><h2>最近任务</h2><div id="task-history"></div></section></section>
<section id="task-result" class="task-result" aria-label="任务结果"><h2>从需求开始</h2><p class="help">先检查环境和相关记忆，再点击启动。任务结束后，这里会显示结果、文件差异和待确认候选。</p></section></div>
<footer>RepoMind 本地记忆库<span>确认后，下一任务才能召回新候选。</span></footer></main></body></html>
