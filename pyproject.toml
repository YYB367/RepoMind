[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind"
version = "4.3.1"
description = "Temporal project memory, isolated code tools, and bounded harness experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
platform = ["langfuse==5.0.4", "mem0ai==2.2.1", "qdrant-client==1.20.0"]

[project.scripts]
repomind = "repomind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repomind.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
